services:
  cpp-server:
    build:
      context: ./src/cpp-server
      dockerfile: Dockerfile
    image: server
    container_name: cpp-server
    ports:
      - "12345:12345"
    command: ["12345"]
    networks:
      - app-network

  web-server:
    build:
      context: ./src/web-server
      dockerfile: Dockerfile
    image: web-server
    container_name: web-server
    ports:
      - "8080:8080"
    environment:
      SERVERIP: ${SERVERIP:-127.17.0.1}  # default to 127.0.0.1, this DOESNT work
    depends_on:
      - cpp-server
    networks:         
      - app-network

  # react-app:
